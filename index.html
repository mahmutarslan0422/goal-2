<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Apple Liquid Glass - Hedef: 6 Saat+</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #F4EBD0;
      overflow: hidden;
      user-select: none;
    }

    .goal-box {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 22px 17px 22px;
      border-radius: 26px;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0.06) 50%,
        rgba(175, 248, 242, 0.08) 100%
      );
      backdrop-filter: blur(8px) saturate(125%);
      -webkit-backdrop-filter: blur(8px) saturate(125%);
      box-shadow: none;
      text-shadow: none;
      overflow: hidden;
    }

    .goal-rim-overlay {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      pointer-events: none;
      z-index: 3;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.28),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.48),
        inset 0 -1.5px 1.5px rgba(255, 255, 255, 0.24),
        inset 0 0 6px 0.5px rgba(235, 245, 252, 0.22);
    }

    .goal-specular-border {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      padding: 1.25px;
      background: linear-gradient(
        165deg,
        rgba(255, 255, 255, 0.42) 0%,
        rgba(175, 248, 242, 0.52) 22%,
        rgba(255, 255, 255, 0.88) 33%,
        rgba(244, 235, 208, 0.52) 44%,
        rgba(255, 255, 255, 0.14) 56%,
        rgba(165, 245, 238, 0.36) 76%,
        rgba(255, 255, 255, 0.65) 90%,
        rgba(255, 255, 255, 0.26) 100%
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 4;
    }

    .goal-line {
      position: relative;
      z-index: 2;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.2px;
      color: #F4EBD0;
      text-shadow: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="goal-box" id="goalWidget">
    <div class="goal-line">Hedef: 6 Saat+</div>
    <div class="goal-line">Goal: 6h+</div>
    <div class="goal-rim-overlay"></div>
    <div class="goal-specular-border"></div>
  </div>
</body>
</html>
